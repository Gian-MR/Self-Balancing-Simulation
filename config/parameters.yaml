# Use meters, kilograms, seconds, and newtons throughout the model.
physics:
  cart_mass: 5.0
  stick_mass: 0.1
  top_mass: 0.1
  stick_length: 1.0
  gravity: 9.81
  cart_friction: 0.05       # Force opposing cart velocity (N per m/s).
  pivot_friction: 0.01     # Torque opposing rotation (N m per rad/s).

simulation:
  duration: 10.0
  control_interval: 0.01   # Read sensors and update force 100 times/second.
  initial_angle_degrees: 12.0
  fall_angle_degrees: 80.0 # End before the rod reaches horizontal.

controller: #LQR means Linear Quadratic Regulator
  max_force: 15.0
  # LQR penalties: [cart position, cart speed, stick angle, angular speed].
  # Larger penalties encourage smaller errors in the corresponding quantity.
  state_weights: [10.0, 1.0, 100.0, 5.0]
  force_weight: 0.1

sensors:
  # Standard deviations in [m, m/s, rad, rad/s]. Zero means ideal readings.
  noise_std: [0.0, 0.0, 0.0, 0.0]
  seed: 7
